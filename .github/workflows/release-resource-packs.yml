name: Release resource packs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build resource-pack archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          shopt -s nullglob
          pack_directories=(ModularPacks-*/)

          if (( ${#pack_directories[@]} == 0 )); then
            echo "No ModularPacks-* directories were found." >&2
            exit 1
          fi

          for pack_directory in "${pack_directories[@]}"; do
            pack_name="${pack_directory%/}"

            if [[ ! -f "${pack_directory}pack.mcmeta" ]]; then
              echo "${pack_name} does not contain pack.mcmeta." >&2
              exit 1
            fi

            echo "Creating dist/${pack_name}.zip"
            (
              cd "${pack_directory}"
              zip -q -r "../dist/${pack_name}.zip" .
            )
          done

          echo "Created archives:"
          ls -lh dist/*.zip

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/*.zip --clobber
          else
            gh release create "${RELEASE_TAG}" dist/*.zip \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
